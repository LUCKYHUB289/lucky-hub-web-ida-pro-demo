<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUCKY HUB WEB IDA PRO</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16130f;
        color: #f2e6cd;
        font: 14px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      code {
        color: #e3b84b;
      }
    </style>
    <script>
      (function () {
        /*
         * SPA fallback for static hosts without rewrite rules (GitHub Pages,
         * S3, plain nginx, cPanel, ...).
         *
         * Change BASE if you host this app in a subfolder, e.g. "/luckyhub/".
         */
        var BASE = "/";

        var target = location.pathname + location.search + location.hash;
        try {
          sessionStorage.setItem("luckyhub:spa-restore", target);
        } catch (e) {
          /* private mode — deep link simply lands on the home page */
        }
        location.replace(BASE);
      })();
    </script>
  </head>
  <body>
    <p>Loading <code>LUCKY HUB WEB IDA PRO</code>…</p>
  </body>
</html>
